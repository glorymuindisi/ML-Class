checkpoint_dir: lab06/results/checkpoints
dataset:
  data_dir: ./data
  name: FashionMNIST
  num_workers: 2
  pin_memory: true
mlflow_experiment_name: Lab06_Training_Pipelines
mlflow_tracking_uri: file:./lab06/results/mlruns
model:
  dropout: 0.25
  hidden_channels:
  - 32
  - 64
  in_channels: 1
  num_classes: 10
results_dir: lab06/results
seed: 42
tasks:
  batch_candidates:
  - 32
  - 64
  - 128
  - 256
  - 512
  run_baseline: true
  run_batch_sweep: true
  run_grad_accum: true
  run_optim_sched_sweep: true
  run_profiler: true
  run_resume_demo: true
  run_worker_sweep: true
  worker_candidates:
  - 0
  - 1
  - 2
  - 4
  - 8
training:
  accumulation_steps: 1
  batch_size: 64
  epochs: 5
  gamma: 0.5
  interrupt_at_epoch: null
  lr: 0.001
  momentum: 0.9
  optimizer: adam
  resume_from: null
  scheduler: cosine
  step_size: 3
  weight_decay: 0.0001
